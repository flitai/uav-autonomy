<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无人系统态势 · 三维地图</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header><strong>无人系统态势</strong><span id="status" role="status">正在加载本地地图…</span></header>
    <main id="scene" aria-label="三维场景"></main>
    <aside aria-label="地图图层">
      <h1>地图图层</h1>
      <label for="base-layer">底图</label>
      <select id="base-layer"><option value="local">本地矢量底图</option><option value="satellite">Esri 在线卫星影像</option></select>
      <label class="check"><input id="terrain-toggle" type="checkbox" checked />USGS 区域地形</label>
      <label class="check"><input id="boundary-toggle" type="checkbox" />地形资格边界</label>
      <p class="hint">区域外使用参考椭球。仿真资格仅覆盖已验收区域。</p>
      <div class="actions"><button id="reset-view">验收区域</button><button id="terrain-detail">地形近景</button><button id="global-view">全球视图</button><button id="beijing-view">北京</button></div>
      <p id="notice" role="alert" hidden></p>
    </aside>
    <footer><span>后端时间：未连接</span><span id="terrain-status">USGS 区域地形</span><span id="location"></span></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
